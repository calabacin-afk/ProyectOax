{% extends "base.html" %}
{% block title %}Iniciar sesión · Descubre Oaxaca{% endblock %}
{% block content %}
<section class="container auth-page">
  <div class="auth-card">
    <span class="eyebrow">Qué bueno verte</span>
    <h1>Inicia sesión</h1>
    <p class="auth-intro">Entra para consultar tus lugares favoritos.</p>
    {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
    <form method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label" for="email">Correo electrónico</label><input class="form-control" id="email" name="email" type="email" value="{{ email or '' }}" autocomplete="username" maxlength="254" required autofocus></div>
      <div class="mb-4"><label class="form-label" for="password">Contraseña</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-forest btn-lg w-100" type="submit">Iniciar sesión</button>
    </form>
    <p class="auth-switch">¿Aún no tienes cuenta? <a href="{{ url_for('auth.register') }}">Regístrate</a></p>
  </div>
</section>
{% endblock %}
