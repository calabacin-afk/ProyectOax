services:
  web:
    build: .
    environment:
      SECRET_KEY: ${SECRET_KEY:?Configura SECRET_KEY en .env}
      FLASK_DEBUG: ${FLASK_DEBUG:-0}
      PORT: 5000
      CHROMA_PATH: /srv/descubre-oaxaca/chroma_data
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-lugares_qwen3_embedding_0_6b_v1}
      OLLAMA_URL: ${OLLAMA_URL_DOCKER:-http://host.docker.internal:11434}
      GEMMA_MODEL: ${GEMMA_MODEL:-gemma4:e4b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
    ports:
      - "127.0.0.1:${PORT:-5000}:5000"
    volumes:
      - chroma_data:/srv/descubre-oaxaca/chroma_data
    restart: unless-stopped

volumes:
  chroma_data:
